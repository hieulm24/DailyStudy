server:
  port: ${PORT:8080}

spring:
  application:
    name: english-learning-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:EnglishLearning};encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=true}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sa}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:fsh@12345}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:${DB_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc:
          lob:
            non_contextual_creation: true

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  default-user:
    email: ${DEFAULT_USER_EMAIL:hieulm24@gmail.com}
    password: ${DEFAULT_USER_PASSWORD:L@nhminhhieudeptrai.1}
    display-name: ${DEFAULT_USER_NAME:Lãnh Minh Hiếu}
  upload:
    dir: ${UPLOAD_DIR:uploads/documents}
  nutrition:
    usda:
      api-key: ${USDA_API_KEY:DEMO_KEY}
      base-url: ${USDA_BASE_URL:https://api.nal.usda.gov/fdc/v1}
