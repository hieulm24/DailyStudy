<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DailyStudy Hub - Kế hoạch & Học tập</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f8fafc;
        z-index: 99999;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .loader-spinner-wrapper {
        position: relative;
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .loader-spinner-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid #e2e8f0;
        border-top-color: #2563eb;
        border-right-color: #3b82f6;
        animation: loader-spin 0.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      .loader-logo {
        width: 32px;
        height: 32px;
        -o-object-fit: contain;
           object-fit: contain;
        border-radius: 6px;
      }
      .loader-text {
        margin-top: 16px;
        font-size: 13px;
        font-weight: 600;
        color: #1e293b;
        letter-spacing: 0.2px;
      }
      .loader-subtext {
        margin-top: 4px;
        font-size: 11px;
        color: #64748b;
      }
      @keyframes loader-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-B_gyqIYr.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CwlWVqJw.css">
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen selection:bg-brand-500 selection:text-white">
    <div id="app">
      <div id="app-loader">
        <div class="loader-spinner-wrapper">
          <div class="loader-spinner-ring"></div>
          <img src="/logo.png" alt="DailyStudy Hub" class="loader-logo" />
        </div>
        <div class="loader-text">DailyStudy Hub</div>
        <div class="loader-subtext">Đang tải dữ liệu công việc & học tập...</div>
      </div>
    </div>
  </body>
</html>
